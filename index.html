<body><div id="app"></div><script>/* boot watchdog: if the app never renders (script error, stale cache, storage/crypto failure in an in-app webview), show
the failing boot step + error name and a clean reload instead of a blank screen. main.js reports steps via __cmStep. */
(function(){var E=[];window.__cmLastStep='html';window.__cmStep=function(n){window.__cmLastStep=n};
var fmt=function(r){return r?((r.name||'Error')+': '+(r.message||r)):'unknown'};
window.__cmBootFail=function(e){E.push('boot step "'+((e&&e.cmStep)||window.__cmLastStep)+'" failed: '+fmt(e))};
addEventListener('error',function(e){E.push('step "'+window.__cmLastStep+'": '+(e.error?fmt(e.error):(e.message||(e.target&&e.target.src)||'load error')))},true);
addEventListener('unhandledrejection',function(e){E.push('step "'+window.__cmLastStep+'" promise: '+fmt(e.reason))});
setTimeout(function(){var a=document.getElementById('app');if((a&&a.children.length)||document.querySelector('.cm-gate,#jackin'))return;var d=document.createElement('div');d.id='cm-bootfail';d.style.cssText='position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:#05060a;color:#cfe;font:15px system-ui;text-align:center';
d.innerHTML='<b>Cybermates did not start.</b><small style="opacity:.75;max-width:90vw;word-break:break-word"></small><button style="padding:12px 22px;font:inherit;border-radius:10px">Reload clean</button>';d.querySelector('small').textContent=(E.join(' | ')||('stalled at step "'+window.__cmLastStep+'", no error reported'))+' · diag '+(function(){try{return localStorage.getItem('cm.bootdiag')||'-'}catch(_){return '-'}})()+' · '+navigator.userAgent;
d.querySelector('button').onclick=function(){var p=[];try{if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}).catch(function(){}));if(self.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}).catch(function(){}))}catch(_){}Promise.all(p).then(function(){location.replace('/?r='+Date.now())},function(){location.replace('/?r='+Date.now())})};document.body.appendChild(d)},9000)})();</script><script type="module" src="/src/main.js"></script></body></html>
