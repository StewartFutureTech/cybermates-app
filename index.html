<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/><link rel="manifest" href="/manifest.webmanifest"/>
<link rel="icon" href="/icon.svg" type="image/svg+xml"/><link rel="icon" href="/icon-192.png" sizes="192x192"/><link rel="apple-touch-icon" href="/icon-180.png"/><title>Cybermates</title></head>
<body><div id="app"></div><script>/* boot watchdog: if the app never renders (script error, stale cache), show the error and a clean reload instead of a blank screen */
(function(){var E=[];addEventListener('error',function(e){E.push((e.message||(e.target&&e.target.src)||'load error')+'')},true);addEventListener('unhandledrejection',function(e){E.push('promise: '+((e.reason&&e.reason.message)||e.reason))});
setTimeout(function(){var a=document.getElementById('app');if((a&&a.children.length)||document.querySelector('.cm-gate,#jackin'))return;var d=document.createElement('div');d.id='cm-bootfail';d.style.cssText='position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:#05060a;color:#cfe;font:15px system-ui;text-align:center';
d.innerHTML='<b>Cybermates did not start.</b><small style="opacity:.75;max-width:90vw;word-break:break-word"></small><button style="padding:12px 22px;font:inherit;border-radius:10px">Reload clean</button>';d.querySelector('small').textContent=(E.join(' | ')||'no error reported')+' · '+navigator.userAgent;
d.querySelector('button').onclick=function(){var p=[];if(navigator.serviceWorker)p.push(navigator.serviceWorker.getRegistrations().then(function(r){return Promise.all(r.map(function(x){return x.unregister()}))}));if(self.caches)p.push(caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))}));Promise.all(p).finally(function(){location.replace('/?r='+Date.now())})};document.body.appendChild(d)},9000)})();</script><script type="module" src="/src/main.js"></script></body></html>
